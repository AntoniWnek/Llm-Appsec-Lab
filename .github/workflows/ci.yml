name: AppSec Lab DevSecOps CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  security-tests-and-sast:
    name: Pytest Suite, Bandit SAST & Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install application dependencies and DevSecOps scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Run Static Application Security Testing (Bandit SAST)
        # B310 (urllib_urlopen) is explicitly skipped because src/tools.py intentionally
        # simulates an unvalidated SSRF fetch in Vulnerable mode (ATK-08).
        run: |
          bandit -r src/ -ll --skip B310

      - name: Run Software Composition Analysis (pip-audit SCA)
        run: |
          pip-audit -r requirements.txt || true

      - name: Initialize SQLite database and stealth PDF fixture
        run: |
          python src/init_db.py
          python src/generate_cv_pdfs.py

      - name: Execute Pytest Security & Integration Suite (48 Cases)
        run: |
          pytest -v
